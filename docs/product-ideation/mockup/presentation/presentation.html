<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<title>AyudaChain redesign: presentation source</title>
<!--
  Source of presentation.mp4. The whole picture is a function of one time value:
  window.renderAt(t) draws exactly the frame for t seconds. Nothing here uses timers,
  CSS animations or transitions. render.mjs steps t one frame at a time and encodes.

  Open this file in a browser to preview and scrub. Add ?t=75 to jump to a time.
  Captions and timings: storyboard.js. Mockup markup: screens.generated.js (generated).
-->
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b1220;overflow:hidden}
body.capture{background:var(--base)}
#frame{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:var(--base);color:var(--ink);font:20px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

/* top strip: brand, mockup label, section progress */
#top{position:absolute;left:96px;width:1728px;top:54px;height:52px;display:flex;align-items:center;gap:14px}
#top .brand{display:flex;align-items:center;gap:11px}
#top .brand svg{width:34px;height:34px;color:var(--blue)}
#top .brand strong{font-size:27px;letter-spacing:-.5px}
#top .brand span{display:none}
.pill{background:var(--warn-bg);border:1px solid #e8dcc0;color:#664313;border-radius:5px;padding:6px 12px;font-size:17px;white-space:nowrap}
.pill b{font-weight:700;letter-spacing:.2px}
#progress{margin-left:auto;display:flex;gap:12px}
#progress .seg{width:150px}
#progress .seg span{display:block;font-size:16px;color:var(--muted);margin-bottom:6px;white-space:nowrap}
#progress .seg.now span{color:var(--ink);font-weight:650}
#progress .track{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
#progress .fill{height:100%;width:100%;background:var(--blue);transform-origin:0 0}

#stage{position:absolute;left:96px;top:120px;width:1728px;height:790px}
#stage>div{position:absolute}

/* caption band */
#caption{position:absolute;left:96px;top:926px;width:1728px;height:100px;background:#fff;border:1px solid var(--line);border-radius:6px}
#caption div{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:600;letter-spacing:-.4px;white-space:nowrap;color:var(--ink)}
#measure{position:absolute;visibility:hidden;white-space:nowrap;left:0;top:0}

/* title */
#title{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#title .brand{display:flex;align-items:center;gap:30px}
#title .brand svg{width:132px;height:132px;color:var(--blue)}
#title .brand strong{font-size:124px;letter-spacing:-4px;line-height:1}
#title .brand span{display:none}
#title .sub{font-size:38px;color:var(--muted);margin-top:26px}
#title .foot{font-size:23px;color:var(--muted);margin-top:44px;max-width:1300px}

/* today's product */
#today{inset:0}
#today .tag{position:absolute;left:0;top:0;font-size:22px;font-weight:650;background:#eef2f7;color:#334155;border-radius:4px;padding:5px 12px}
#today .box{position:absolute;background:#fff;border:1px solid #9aacbf;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#today .box b{font-size:24px;font-weight:650}
#today .box code{font:19px/1.3 Consolas,"Cascadia Mono",monospace;color:var(--muted);margin-top:4px}
#today .note{position:absolute;left:0;width:100%;top:690px;text-align:center;font-size:26px;color:var(--bad);font-weight:600}
#today svg{position:absolute;left:0;top:0;overflow:visible}
#today svg path{fill:none;stroke:#64748b;stroke-width:1.6}

/* site map */
#map{inset:0}
#map svg{position:absolute;left:0;top:0;overflow:visible}
#map svg path{fill:none;stroke:#9aacbf;stroke-width:1.6}
#map svg path.jr{stroke:var(--blue);stroke-width:2.6}
#map svg path.re{stroke:var(--blue);stroke-width:3.6}
#map svg polygon{fill:var(--blue)}
.mnode,.mhead,.mroot{position:absolute;display:flex;align-items:center;white-space:nowrap}
.mroot{justify-content:center;background:var(--ink);color:#fff;border-radius:5px;font-size:24px;font-weight:650;letter-spacing:-.3px}
.mroot small{font-size:16px;font-weight:400;opacity:.85;margin-left:10px;letter-spacing:0}
.mhead{background:var(--blue-soft);border:1px solid #a8bfe9;color:#1e3a8a;border-radius:5px;padding:0 13px;font-size:20px;font-weight:650;justify-content:space-between}
.mhead small{font-size:14px;font-weight:400;margin-left:8px}
.mnode{background:#fff;border:1px solid var(--line);border-radius:5px;padding:0 12px;color:var(--ink)}
.mnode .on{position:absolute;inset:-1px;display:flex;align-items:center;padding:0 12px;background:var(--blue-soft);border:2px solid var(--blue);border-radius:5px;color:#1e3a8a;font-weight:600}
.mnode .num{position:absolute;left:-13px;top:-13px;min-width:28px;height:28px;padding:0 7px;border-radius:14px;background:var(--blue);color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
#chip{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;gap:8px;width:0;height:38px}
#chip b{background:var(--blue);color:#fff;border-radius:19px;padding:5px 15px;font-size:19px;font-weight:700;white-space:nowrap;box-shadow:0 4px 14px rgba(15,23,42,.25)}
#chip span{background:#0f172a;color:#fff;border-radius:5px;padding:4px 10px;font-size:17px;white-space:nowrap}
#dot{position:absolute;left:-8px;top:-8px;width:16px;height:16px;border-radius:8px;background:var(--blue);box-shadow:0 0 0 5px rgba(29,78,216,.22)}

/* one role, nine screens */
#grid{inset:0}
#gridhead{position:absolute}
#gridlimit{position:absolute;left:372px;top:0;width:1356px;height:56px;display:flex;align-items:center;font-size:21px;line-height:1.3;color:var(--muted)}
#gridlimit b{color:var(--ink);font-weight:650}
.tile{position:absolute;background:#fff;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.tile .bar{display:flex;align-items:center;padding:0 12px;white-space:nowrap;border-bottom:1px solid var(--line)}
.tile .port{position:relative;overflow:hidden}

/* the screen */
.view{position:absolute;overflow:hidden;background:var(--base);border-radius:6px}
#head{left:0;top:4px;width:1728px;height:48px;display:flex;align-items:center;gap:10px;white-space:nowrap}
#head .rc{position:relative;border:1px solid var(--line);background:#fff;border-radius:5px;padding:6px 13px;font-size:19px;color:var(--muted)}
#head .rc.seen{color:var(--ink)}
#head .rc i{position:absolute;inset:-1px;font-style:normal;display:flex;align-items:center;justify-content:center;background:var(--blue);border-radius:5px;color:#fff;font-weight:650}
#head .scr{font-size:23px;font-weight:650;margin-left:8px}
#head .rec{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:5px;padding:6px 13px;font-size:19px}
#head .rec b{font-weight:650;font-variant-numeric:tabular-nums}

/* closing card */
#close{left:214px;top:150px;width:1300px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:44px 56px;text-align:center}
#close h1{margin:0 0 6px;font-size:58px;letter-spacing:-1.5px;font-weight:650}
#close .state{font-size:27px;color:var(--muted);margin:0 0 30px}
#close .banner{background:var(--warn-bg);border:1px solid #e8dcc0;color:#664313;border-radius:5px;padding:20px 26px;font-size:27px;line-height:1.45;text-align:left}
#close .banner strong{margin-right:12px}
#close .foot{font-size:23px;color:var(--muted);margin:26px 0 0}

/* preview controls: never part of a rendered frame */
#scrub{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 18px;background:#0b1220;color:#cbd5e1;font:14px/1 "Segoe UI",sans-serif}
#scrub input{flex:1}
#scrub button{font:inherit;padding:7px 14px;border-radius:4px;border:1px solid #475569;background:#1e293b;color:#fff;cursor:pointer}
#scrub output{min-width:330px;font-variant-numeric:tabular-nums}
body.capture #scrub{display:none}
</style>
</head>
<body>
<div id="frame">
  <div id="top">
    <div class="brand" id="topbrand"></div>
    <div class="pill" id="mocklabel"></div>
    <div class="pill" id="simlabel"></div>
    <div id="progress"></div>
  </div>
  <div id="stage">
    <div id="title"></div>
    <div id="today"></div>
    <div id="map"></div>
    <div id="grid"></div>
    <div id="head"></div>
    <div id="close"></div>
  </div>
  <div id="caption"><div id="capB"></div><div id="capA"></div></div>
  <span id="measure"></span>
</div>
<div id="scrub"><button id="play">Play</button><input id="time" type="range" min="0" step="0.0333" value="0"><output id="clock"></output></div>

<script src="screens.generated.js"></script>
<script src="storyboard.js"></script>
<script>
"use strict";
(() => {
const SB = globalThis.STORYBOARD, M = window.MOCK;
const CAPTURE = new URLSearchParams(location.search).has("capture");
document.body.classList.toggle("capture", CAPTURE);
const $ = (id) => document.getElementById(id);
const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- motion vocabulary: one easing, a few durations ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const seg = (t, a, b) => clamp((t - a) / (b - a));
const es = (t, a, b) => ease(seg(t, a, b));
const lerp = (a, b, p) => a + (b - a) * p;
const lerpRect = (A, B, p) => ({ x: lerp(A.x, B.x, p), y: lerp(A.y, B.y, p), w: lerp(A.w, B.w, p), h: lerp(A.h, B.h, p) });
const ARRIVE = { tile: 1.5, handoff: 2.4, nav: 1.0, state: 0, scroll: 0 };
const CHANGE = 0.4; // seconds from a button press to the screen showing its result
const show = (node, alpha) => { node.style.display = alpha <= 0.001 ? "none" : ""; node.style.opacity = alpha >= 0.999 ? "" : alpha.toFixed(3); };
const place = (node, r) => { node.style.left = r.x.toFixed(2) + "px"; node.style.top = r.y.toFixed(2) + "px"; node.style.width = r.w.toFixed(2) + "px"; node.style.height = r.h.toFixed(2) + "px"; };

// ---------- the mockup's own tokens and stylesheet ----------
const rootVars = (M.css.match(/:root\{([^}]*)\}/) || [0, ""])[1];
for (const decl of rootVars.split(";")) { const i = decl.indexOf(":"); if (i > 0) document.documentElement.style.setProperty(decl.slice(0, i).trim(), decl.slice(i + 1).trim()); }
function stripMedia(css) { // responsive, print and animation rules must not depend on the preview window
  let out = "", i = 0;
  for (;;) {
    const a = css.indexOf("@media", i);
    if (a < 0) return out + css.slice(i);
    out += css.slice(i, a);
    let depth = 0, j = css.indexOf("{", a);
    for (; j < css.length; j++) { if (css[j] === "{") depth++; else if (css[j] === "}" && --depth === 0) { j++; break; } }
    i = j;
  }
}
const WD = 1382, HD = 579, SIDE = 220, GAP = 22, WORK = WD - SIDE - GAP, ACTION_H = 78; // mockup design pixels
const mockSheet = new CSSStyleSheet();
mockSheet.replaceSync(
  stripMedia(M.css).replace(":root{", ":host{").replace("}body{", "}.mock-body{") + `
  *{animation:none!important;transition:none!important}
  :host{display:block;position:absolute;left:0;top:0;transform-origin:0 0}
  .mock-body{margin:0}
  .pv-layout{display:grid;grid-template-columns:${SIDE}px minmax(0,1fr);gap:${GAP}px;width:${WD}px;height:${HD}px}
  .sidebar{position:static}
  .pv-work{display:flex;flex-direction:column;height:${HD}px}
  .pv-scroll{position:relative;flex:1;overflow:hidden}
  .pv-layer{position:absolute;left:0;top:0;width:100%;background:#fff}
  .pv-actions{position:relative;flex:none;height:${ACTION_H}px;border-top:1px solid var(--line);background:#fff}
  .pv-action{position:absolute;inset:0;display:flex;align-items:center;padding:0 28px;background:#fff}
  .pv-action .action-area{flex:1;border:0;margin:0;padding:0}
  .tile-work{width:${WORK}px;border:0;border-radius:0}
  /* --hl fades the highlight in after a value changes */
  dd.chg,.identity p.chg,.spot{justify-self:start;width:fit-content;background:rgba(219,231,255,var(--hl,1));box-shadow:0 0 0 2px rgba(219,231,255,var(--hl,1));outline:2px solid rgba(29,78,216,var(--hl,1));outline-offset:2px;border-radius:2px}
  .code.chg{display:inline-block;padding:10px 16px 6px 20px;margin:8px 0 6px;background:rgba(219,231,255,var(--hl,1));outline:2px solid rgba(29,78,216,var(--hl,1));border-radius:3px}
  .spot{font-weight:600;padding:2px 4px}
  td.chg{background:rgba(219,231,255,var(--hl,1));box-shadow:inset 0 0 0 2px rgba(29,78,216,var(--hl,1))}
  input.chg{background:rgba(219,231,255,var(--hl,1));box-shadow:0 0 0 2px rgba(29,78,216,var(--hl,1))}
  .notice.chg,.timeline li.chg{box-shadow:0 0 0 2px rgba(29,78,216,var(--hl,1))}
  `);

// ---------- timeline ----------
const beats = SB.beats;
let acc = 0;
beats.forEach((b, i) => { b.i = i; b.t0 = acc; acc += b.dur; b.t1 = acc; });
const TOTAL = acc;
const beatAt = (t) => beats.find((b) => t < b.t1) || beats[beats.length - 1];
const sections = SB.sections.map((s) => { const own = beats.filter((b) => b.section === s.id); return { ...s, t0: own[0].t0, t1: own[own.length - 1].t1 }; });
const screenBeats = beats.filter((b) => b.kind === "screen");
const roles = Object.keys(M.roleNames);
const pageName = (r, p) => M.pages[r].find((x) => x[0] === p)[1];
const pageIdx = (r, p) => M.pages[r].findIndex((x) => x[0] === p);
let visitN = 0, handK = 0;
const handoffs = [], navs = [];
screenBeats.forEach((b, j) => {
  b.arr = ARRIVE[b.arrive];
  b.prev = screenBeats[j - 1] || null;
  if (b.arrive === "handoff") { b.hand = { k: handK++, beat: b }; handoffs.push(b.hand); }
  if (b.arrive === "nav") navs.push(b);
  if (b.arrive === "tile" || b.arrive === "handoff" || b.arrive === "nav") { b.visit = ++visitN; b.visitAt = b.t0 + { tile: 1.2, handoff: 1.7, nav: 0.5 }[b.arrive]; }
  b.presses = b.press || b.steps.slice(1).map((_, k) => (b.arr || 0.1) + 1.5 + k * 2.6);
});

// ---------- top strip ----------
$("topbrand").innerHTML = M.brand;
$("mocklabel").innerHTML = `<b>${esc(SB.labels.mockup)}</b> · ${esc(SB.labels.mockupNote)}`;
$("simlabel").innerHTML = `<b>${esc(SB.labels.simulated)}</b> · ${esc(SB.labels.simulatedNote)}`; // both labels sit in every frame
sections.forEach((s, i) => { const n = el("div", "seg", `<span>${i + 1} · ${esc(s.label)}</span><div class="track"><div class="fill"></div></div>`); s.el = n; s.fill = n.querySelector(".fill"); $("progress").appendChild(n); });

// ---------- captions (fit to one line) ----------
const CAP_SIZE = 44, CAP_MAX = 1640;
$("measure").style.cssText += `;font-weight:600;letter-spacing:-.4px;font-size:${CAP_SIZE}px`;
beats.forEach((b) => { $("measure").textContent = b.caption; b.capSize = Math.min(CAP_SIZE, Math.floor(CAP_SIZE * CAP_MAX / $("measure").offsetWidth)); });
const setCaption = (node, b, alpha) => { if (b && node._b !== b) { node.textContent = b.caption; node.style.fontSize = b.capSize + "px"; node._b = b; } show(node, b ? alpha : 0); };

// ---------- geometry (stage coordinates) ----------
const STAGE_W = 1728, PANEL = { x: 0, y: 66, w: 1728, h: 724 };
const HERO = { x: (SIDE + GAP) * PANEL.w / WD, y: PANEL.y, w: WORK * PANEL.w / WD, h: PANEL.h }; // where a screen's workspace sits inside PANEL
const COLW = STAGE_W / roles.length, ROOT = { x: (STAGE_W - 440) / 2, y: 0, w: 440, h: 48 }, TRUNK_Y = 66;
const HEAD = { dx: 8, y: 84, w: 282, h: 56 }, SPINE_DX = 22, NODE = { dx: 40, w: 250, h: 46, y0: 214, pitch: 60 };
const GUT0 = 299, LANE = 6.5, BUS0 = 151, BUSLANE = 8; // journey lines run in the gutter right of each column and a bus under the headers
const colLeft = (r) => roles.indexOf(r) * COLW;
const nodeRect = (r, p) => ({ x: colLeft(r) + NODE.dx, y: NODE.y0 + pageIdx(r, p) * NODE.pitch, w: NODE.w, h: NODE.h });
const headRect = (r) => ({ x: colLeft(r) + HEAD.dx, y: HEAD.y, w: HEAD.w, h: HEAD.h });
const NS = "http://www.w3.org/2000/svg";
function rounded(pts, r = 7) {
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
    const d1 = Math.hypot(x1 - x0, y1 - y0), d2 = Math.hypot(x2 - x1, y2 - y1), rr = Math.min(r, d1 / 2, d2 / 2);
    d += ` L${x1 - (x1 - x0) / d1 * rr} ${y1 - (y1 - y0) / d1 * rr} Q${x1} ${y1} ${x1 + (x2 - x1) / d2 * rr} ${y1 + (y2 - y1) / d2 * rr}`;
  }
  const last = pts[pts.length - 1];
  return d + ` L${last[0]} ${last[1]}`;
}
function mkPath(svg, pts, cls) {
  const p = document.createElementNS(NS, "path");
  p.setAttribute("d", rounded(pts)); if (cls) p.setAttribute("class", cls);
  svg.appendChild(p);
  const len = p.getTotalLength();
  p.style.strokeDasharray = `${len} ${len}`;
  return { el: p, len };
}
const drawPath = (P, p, alpha = 1) => { P.el.style.display = p <= 0.0005 || alpha <= 0.001 ? "none" : ""; P.el.style.strokeDashoffset = (P.len * (1 - clamp(p))).toFixed(2); P.el.style.opacity = alpha.toFixed(3); };
function mkArrow(svg, x, y, dir) { // tip at (x, y); dir = +1 points right, -1 points left
  const a = document.createElementNS(NS, "polygon");
  a.setAttribute("points", `${x},${y} ${x - dir * 11},${y - 6} ${x - dir * 11},${y + 6}`);
  svg.appendChild(a);
  return a;
}
const fitFont = (text, weight, size, max, min) => { const m = $("measure"); m.style.fontWeight = weight; m.style.letterSpacing = "0"; m.style.fontSize = size + "px"; m.textContent = text; const w = m.offsetWidth; return w <= max ? size : Math.max(min, Math.floor(size * max / w * 10) / 10); };

// ---------- title ----------
$("title").innerHTML = `<div class="brand">${M.brand}</div><div class="sub">Redesign: ${esc(M.brandSubtitle.toLowerCase())}</div><div class="foot">${esc(M.footer.split(". ").slice(0, 2).join(". "))}.</div>`;

// ---------- today's product (from docs/product/sitemap.md) ----------
const today = { roles: [], pages: [], lines: [] };
(() => {
  const host = $("today"), T = SB.today;
  host.appendChild(today.tag = el("div", "tag", esc(T.tag)));
  const svg = document.createElementNS(NS, "svg"); svg.setAttribute("width", STAGE_W); svg.setAttribute("height", 790); host.appendChild(svg);
  const rw = 330, rh = 76, ry = 120, pw = 300, ph = 100, py = 500;
  T.roles.forEach((name, i) => { const x = STAGE_W / 2 + (i - 1) * 480 - rw / 2; const n = el("div", "box", `<b>${esc(name)}</b>`); place(n, { x, y: ry, w: rw, h: rh }); host.appendChild(n); today.roles.push({ el: n, cx: x + rw / 2 }); });
  T.pages.forEach(([route, name], j) => { const x = j * ((STAGE_W - pw) / 4); const n = el("div", "box", `<b>${esc(name)}</b><code>${esc(route)}</code>`); place(n, { x, y: py, w: pw, h: ph }); host.appendChild(n); today.pages.push({ el: n, cx: x + pw / 2 }); });
  today.roles.forEach((r, i) => today.pages.forEach((p, j) => {
    const sx = r.cx + (j - 2) * 34, ex = p.cx + (i - 1) * 46, p1 = document.createElementNS(NS, "path");
    p1.setAttribute("d", `M${sx} ${ry + rh} C${sx} ${ry + rh + 150} ${ex} ${py - 150} ${ex} ${py}`); svg.appendChild(p1);
    const len = p1.getTotalLength(); p1.style.strokeDasharray = `${len} ${len}`; today.lines.push({ el: p1, len });
  }));
  host.appendChild(today.note = el("div", "note", esc(T.note)));
})();

// ---------- site map ----------
const map = { roles: {}, nodes: {}, hand: [], nav: [], order: [] };
(() => {
  const host = $("map");
  const svg = map.svg = document.createElementNS(NS, "svg"); svg.setAttribute("width", STAGE_W); svg.setAttribute("height", 790); host.appendChild(svg);
  map.root = el("div", "mroot", `${esc(M.brand.match(/<strong>(.*?)<\/strong>/)[1])}<small></small>`); place(map.root, ROOT); host.appendChild(map.root);
  map.rootNote = map.root.querySelector("small");
  const total = roles.reduce((n, r) => n + M.pages[r].length, 0);
  map.rootNote.textContent = `${roles.length} roles · ${total} proposed screens`;
  for (const r of roles) {
    const left = colLeft(r), hr = headRect(r), cx = hr.x + hr.w / 2, pages = M.pages[r], R = map.roles[r] = { nodes: [] };
    R.beat = beats.find((b) => b.kind === "map" && b.role === r);

      const C = head.chips[r];
      show(C.on, r === headRole ? roleMix : r === headPrev ? 1 - roleMix : 0);
      C.el.classList.toggle("seen", screenBeats.some((sb) => sb.role === r && sb.t0 + sb.arr <= t + 1e-6));
    }
    head.scr.textContent = pageName(nameBeat.role, nameBeat.page); head.scr.style.opacity = nameA.toFixed(3);
  }

  show($("close"), b.kind === "close" ? es(lt, 0.4, 1.0) : 0);
}

// ---------- checkpoints for stills: the middle of every beat and every transition ----------
const checkpoints = [];
beats.forEach((b, i) => {
  const n = String(i + 1).padStart(2, "0"), add = (label, lt) => checkpoints.push({ name: `${n}-${b.id}-${label}`, t: +(b.t0 + lt).toFixed(3) });
  if (b.kind === "screen") {
    if (b.arrive === "handoff") { add("t1-leave", 0.35); add("t2-travel", 1.2); add("t3-arrive", 2.05); }
    if (b.arrive === "tile") add("t-open", 0.75);
    if (b.arrive === "nav") add("t-nav", 0.35);
    b.presses.forEach((tp, k) => { add(`t-press${k + 1}`, tp + 0.28); add(`t-change${k + 1}`, tp + CHANGE + 0.2); });
    (b.scrollKeys || []).slice(1).forEach((key, k) => add(`t-scroll${k + 1}`, key.at + key.dur / 2));
    const settled = Math.max(b.arr, ...b.presses.map((tp) => tp + CHANGE + 0.4), ...b.scrollKeys.slice(1).map((key) => key.at + key.dur));
    add("hold", (settled + b.dur) / 2);
  } else {
    if (b.kind === "map") add("t-build", 1.6);
    if (b.kind === "today") add("t-build", 2.4);
    if (b.kind === "grid") add("t-open", 0.9);
    if (b.kind === "path") { add("t-pullback", 0.4); add("t-retrace", 2.8); }
    if (b.kind === "close") add("t-in", 0.5);
    add("hold", b.kind === "path" ? 6.8 : b.dur * 0.66);
  }
});

window.TOTAL = TOTAL;
window.FPS = SB.fps;
window.CHECKPOINTS = checkpoints;
window.BEATS = beats.map((b) => ({ n: b.i + 1, id: b.id, section: b.section, kind: b.kind, t0: b.t0, dur: b.dur, arrive: b.arrive || null, arr: b.arr || 0, caption: b.caption, capSize: b.capSize }));
window.renderAt = renderAt;

// ---------- preview only: fit to the window and scrub. Not used when rendering. ----------
if (!CAPTURE) {
  const fit = () => { const s = Math.min(innerWidth / 1920, (innerHeight - 56) / 1080); $("frame").style.transform = `scale(${s})`; };
  addEventListener("resize", fit); fit();
  const time = $("time"), clock = $("clock"); time.max = TOTAL;
  let now = +(new URLSearchParams(location.search).get("t") || 0), playing = false, last = 0;
  const paint = () => { renderAt(now); time.value = now; const b = beatAt(now); clock.textContent = `${now.toFixed(2)} s / ${TOTAL.toFixed(1)} s · beat ${b.i + 1} ${b.id}`; };
  time.addEventListener("input", () => { now = +time.value; paint(); });
  $("play").addEventListener("click", () => { playing = !playing; $("play").textContent = playing ? "Pause" : "Play"; last = performance.now(); if (playing) requestAnimationFrame(tick); });
  const tick = (ts) => { if (!playing) return; now = Math.min(TOTAL, now + (ts - last) / 1000); last = ts; paint(); if (now >= TOTAL) { playing = false; $("play").textContent = "Play"; } else requestAnimationFrame(tick); };
  paint();
} else renderAt(0);
window.READY = true;
})();
</script>
</body>
</html>
